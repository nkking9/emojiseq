[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emojiseq"
version = "0.1.0"
description = "Decompose and classify emoji sequences by codepoint"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nkking9" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
